---
- name: Handlers example
  hosts: localhost


  tasks:
    - name: Install httpd
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Deploy httpd config
      ansible.builtin.template:
        src: httpd.conf.j2
        dest: /etc/httpd/conf/httpd.conf
      notify: Restart httpd

    - name: Open HTTP in firewall
      ansible.builtin.firewalld:
        service: http
        permanent: true 
        immediate: true
        state: enabled

  handlers:
    - name: Restart httpd 
      ansible.builtin.service:
        name: httpd
        state: restarted 


    